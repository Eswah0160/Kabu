<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabu</title>
<meta name="description" content="Test simple trading rules on real ASX prices, then run them with paper money.">
<meta name="theme-color" content="#111110">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #E7E7E4; --sheet: #F6F6F3; --ink: #262625; --ink-2: #63635F; --rule: #D3D3CF; --soft: #EEEEEA;
  --red: #BD3226; --up: #1d7a4f; --down: #BD3226;
  --s-trend: #2a78d6; --s-monthly: #eb6834; --s-dip: #1baf7a; --s-bench: #8a8a85;
  --shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 24px -18px rgba(0,0,0,.35);
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-body: "Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #9A9A95; --rule: #2C2C2A; --soft: #232322;
    --red: #FF6B5E; --up: #4cc38a; --down: #FF6B5E;
    --s-trend: #3987e5; --s-monthly: #d95926; --s-dip: #199e70; --s-bench: #8d8d88;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #9A9A95; --rule: #2C2C2A; --soft: #232322;
  --red: #FF6B5E; --up: #4cc38a; --down: #FF6B5E;
  --s-trend: #3987e5; --s-monthly: #d95926; --s-dip: #199e70; --s-bench: #8d8d88;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.lbl { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); font-size: 13.5px; margin: 0; }
.err { color: var(--red); font-size: 14px; margin: 0; }
.up { color: var(--up); } .down { color: var(--down); }
[data-s="trend"] { --c: var(--s-trend); } [data-s="monthly"] { --c: var(--s-monthly); } [data-s="dip"] { --c: var(--s-dip); } [data-s="bench"] { --c: var(--s-bench); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-2)); flex: none; }

/* frame */
.app { min-height: 100%; display: flex; flex-direction: column; max-width: 1240px; margin: 0 auto; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--paper); }
.brand { font-family: var(--f-mono); font-weight: 500; letter-spacing: 0.3em; font-size: 15px; }
.brand small { font-weight: 400; letter-spacing: 0.1em; color: var(--ink-2); margin-left: 4px; }
.pill { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; border: 1px solid var(--ink-2); border-radius: 999px; padding: 2px 8px; color: var(--ink-2); }
.grow { flex: 1; }
.ghost { border: 0; background: none; min-width: 40px; height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); padding: 0 8px; }
.ghost:active { background: var(--soft); }
.ghost svg { width: 19px; height: 19px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.panes { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 0 12px 84px; }
.pane { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--sheet); border-top: 1px solid var(--rule); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
.tab { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; min-height: 52px; color: var(--ink-2); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 8px; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { stroke-width: 2.2; }
.rtabs { display: none; }
@media (min-width: 720px) {
  .panes { grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.4fr); padding-bottom: 16px; }
  .tabs { display: none; }
  .rtabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .rtabs button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; min-height: 38px; padding: 0 12px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .rtabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
}

/* cards */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.card-head { display: flex; align-items: center; gap: 2px 8px; flex-wrap: wrap; }
.card-head h2 { white-space: nowrap; }
.card-head .lbl { margin-left: auto; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; min-height: 42px; padding: 0 14px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); font-weight: 500; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, var(--rule)); }
.btn:disabled { opacity: 0.5; }
.link { border: 0; background: none; padding: 6px 0; min-height: 36px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule); background: transparent; border-radius: 999px; min-height: 36px; padding: 0 12px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.08em; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.chip .dot { width: 8px; height: 8px; }

/* home */
.hero-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.notice { border: 1px dashed var(--ink-2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.notice.warn { border-color: var(--red); }
.orders { display: flex; flex-direction: column; }
.order { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--rule); }
.order:first-child { border-top: 0; padding-top: 2px; }
.order .side { font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; }
.order .side.sell { color: var(--red); }
.order .what { font-family: var(--f-mono); font-size: 14px; }
.order .why { grid-column: 2 / -1; color: var(--ink-2); font-size: 13px; }
.strat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; border: 0; background: none; text-align: left; padding: 12px 0; border-top: 1px solid var(--rule); width: 100%; }
.strat:first-of-type { border-top: 0; }
.strat .nm { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.strat .val { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.strat .sub { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.strat .spark { grid-column: 1 / -1; height: 34px; width: 100%; }
.big { font-family: var(--f-mono); font-size: 30px; font-weight: 400; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

/* charts */
.chart { position: relative; width: 100%; touch-action: pan-y; user-select: none; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .grid line { stroke: var(--rule); stroke-width: 1; }
.chart .axis text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink-2); }
.chart .ser { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ser.bench { stroke-dasharray: 4 4; stroke-width: 1.6; }
.chart .ser.thin { stroke-width: 1.4; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .pt { fill: var(--c); stroke: var(--sheet); stroke-width: 2; }
.chart .mk-b { fill: var(--up); } .chart .mk-s { fill: var(--down); }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--sheet); border-radius: 8px; padding: 6px 9px; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; white-space: nowrap; transform: translateX(-50%); z-index: 2; }
.tip .r { display: flex; align-items: center; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ln { width: 16px; height: 0; border-top: 2px solid var(--c); }
.legend .ln.dash { border-top-style: dashed; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); text-align: right; padding: 6px 6px; white-space: nowrap; }
.tbl td { padding: 9px 6px; border-top: 1px solid var(--rule); text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
.tbl td:first-child { font-family: var(--f-body); }
.tbl tr.click { cursor: pointer; }
.tbl .nm { display: inline-flex; align-items: center; gap: 7px; }
.scroll-x { overflow-x: auto; }
.wide-only, .mid-only { display: none; }
@media (min-width: 430px) { .mid-only { display: table-cell; } }
@media (min-width: 560px) { .wide-only { display: table-cell; } }
.log { display: flex; flex-direction: column; }
.log-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.log-row:first-child { border-top: 0; }
.log-row .d { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.log-row .t { font-family: var(--f-mono); font-size: 14px; }
.log-row .v { font-family: var(--f-mono); font-size: 13px; text-align: right; }
.log-row .why { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-2); }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field input, .field select { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; min-height: 42px; padding: 0 10px; width: 100%; font-family: var(--f-mono); font-size: 14px; }
.field input:focus { outline: 2px solid var(--ink-2); outline-offset: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 42px; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }
details summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 40px; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "▾"; margin-left: auto; color: var(--ink-2); }
details[open] summary::after { content: "▴"; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.tickers { display: flex; flex-wrap: wrap; gap: 6px; }
.tk { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--rule); border-radius: 999px; padding: 0 2px 0 12px; font-family: var(--f-mono); font-size: 13px; min-height: 36px; }
.tk button { border: 0; background: none; min-width: 32px; min-height: 32px; color: var(--ink-2); border-radius: 999px; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(20,20,18,.42); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet); width: 100%; max-width: 720px; max-height: 92vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
.sheet-body { overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 14px; } }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--sheet); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
@media (min-width: 720px) { .toast { bottom: 24px; } }
.foot { text-align: center; padding: 6px 0 2px; }
.help h3 { margin: 6px 0 0; font-size: 15px; }
.help p { margin: 0; font-size: 14.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-family: var(--f-mono); text-align: right; }

/* ---- v3 ---- */
[data-s="me"] { --c: var(--ink); } .dot.bot { background: var(--ink-2); border-radius: 2px; }
.ver { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-2); border-bottom: 1px dotted var(--ink-2); }
@media (max-width: 380px) { .hide-narrow { display: none; } }
.status-chip { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 999px; padding: 3px 9px; margin-left: auto; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.status-chip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.status-chip.ok { color: var(--up); border-color: color-mix(in srgb, var(--up) 45%, var(--rule)); }
.status-chip.warn { color: #c98a12; border-color: color-mix(in srgb, #c98a12 45%, var(--rule)); }
.status-chip.err { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--rule)); }
.notice.ok { border-style: solid; border-color: color-mix(in srgb, var(--up) 55%, var(--rule)); }
.bullets { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.note { margin: 0; font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--rule); padding: 2px 0 2px 10px; }
.hint { font-size: 12px; color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* on/off switch */
.switch { position: relative; display: inline-flex; align-items: center; min-width: 52px; min-height: 40px; justify-content: center; cursor: pointer; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .track { width: 40px; height: 24px; border-radius: 999px; background: var(--rule); position: relative; transition: background .15s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + .track { background: var(--ink); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--ink-2); outline-offset: 2px; }
/* segmented buttons */
.seg { display: flex; border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 3px; background: var(--paper); }
.seg button { flex: 1; border: 0; background: none; border-radius: 6px; min-height: 38px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
/* leaderboard */
.lb { display: flex; flex-direction: column; }
.lb-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 2px 10px; align-items: center; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; padding: 10px 0; width: 100%; }
.lb-row:first-child { border-top: 0; }
.lb-row .rank { color: var(--ink-2); font-size: 12px; }
.lb-row .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; }
.lb-row .nm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-row .val { font-size: 14px; text-align: right; }
.lb-row .ret { font-size: 15px; text-align: right; min-width: 64px; }
.lb-row .sub { grid-column: 2 / -1; font-size: 11.5px; color: var(--ink-2); }
.lb-row .spark { grid-column: 2 / -1; height: 26px; width: 100%; }
.lb-row.me .nm { font-weight: 700; }
.lb-row.me { background: linear-gradient(90deg, color-mix(in srgb, var(--ink) 6%, transparent), transparent); }
/* activity */
.feed { display: flex; flex-direction: column; }
.feed-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 13.5px; }
.feed-row:first-child { border-top: 0; }
.feed-row .when { grid-column: 2; font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
.feed-row.err .what { color: var(--red); }
/* strategies list */
.strat-list { display: flex; flex-direction: column; }
.strat-row { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--rule); }
.strat-row:first-child { border-top: 0; }
.strat-row.off .strat-main { opacity: 0.55; }
.strat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; border: 0; background: none; text-align: left; padding: 11px 0; }
.strat-main .nm { display: flex; align-items: center; gap: 8px; }
.strat-main .desc { font-size: 13px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.strat-main .sub { font-size: 11.5px; color: var(--ink-2); }
.tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; color: var(--ink-2); }
/* builder */
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.preset { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 12px; min-height: 44px; }
.preset .muted { font-size: 13px; }
.cond { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); }
.cond select, .field select { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; min-height: 40px; padding: 0 8px; font-size: 14px; max-width: 100%; }
.cond > .row > select { flex: 1; min-width: 0; font-weight: 500; }
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.sentence select { min-height: 38px; }
.sentence input.inline { width: 76px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; min-height: 38px; padding: 0 8px; font-family: var(--f-mono); font-size: 14px; }
.sticky-actions { position: sticky; bottom: -24px; background: var(--sheet); padding: 10px 0 4px; border-top: 1px solid var(--rule); }
.guide section { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 8px; }
.guide-tbl td { white-space: normal; text-align: left; font-family: var(--f-body); font-size: 13.5px; vertical-align: top; min-width: 120px; }
.guide-tbl th { text-align: left; }

.order.with-action { grid-template-columns: auto auto minmax(0, 1fr) auto; }

.field .hint { margin-top: -1px; }
.order.with-action .link { padding: 0 0 0 8px; min-height: 32px; }

<script>
const ENGINE_SRC = "/* Kabu engine: the same code runs the backtests in the app and the paper bot in the Google bridge.\n   Daily bars. Signals are taken at the close; orders fill at the next trading day's open. */\nvar KabuEngine = (function () {\n  var STRATS = ['trend', 'monthly', 'dip'];\n  var NAMES = { trend: 'Trend filter', monthly: 'Monthly invest', dip: 'Dip buying', hold: 'Buy and hold', manual: 'You' };\n  var DEFAULTS = {\n    trend: { sma: 200, band: 0.02 },                                // hold while the close is 2% above its 200-day average; sell 2% below\n    monthly: { drift: 0.05 },                                       // rebalance to equal weight on the first trading day of each month\n    dip: { drop: 0.07, lookback: 20, trend: 200, exitSma: 10, maxDays: 20, stop: 0.08 },\n    hold: {},\n  };\n  var COSTS = { feePct: 0.001, feeMin: 5, slip: 0.0005 };\n\n  var r2 = function (x) { return Math.round(x * 100) / 100; };\n  var num = function (x) { return typeof x === 'number' && isFinite(x) ? x : null; };\n\n  // ---- indicators (null until there is enough history) ----\n  function sma(xs, n) {\n    var out = new Array(xs.length), sum = 0, q = [];\n    for (var i = 0; i < xs.length; i++) {\n      var x = xs[i];\n      if (x != null) { q.push(x); sum += x; if (q.length > n) sum -= q.shift(); }\n      out[i] = q.length >= n ? sum / n : null;\n    }\n    return out;\n  }\n  function rollMax(xs, n) {\n    var out = new Array(xs.length), q = [];\n    for (var i = 0; i < xs.length; i++) {\n      if (xs[i] != null) { q.push(xs[i]); if (q.length > n) q.shift(); }\n      out[i] = q.length ? Math.max.apply(null, q) : null;\n    }\n    return out;\n  }\n  // Wilder's RSI on closes\n  function rsi(xs, n) {\n    var out = new Array(xs.length).fill(null), prev = null, g = 0, l = 0, k = 0, ag = null, al = null;\n    for (var i = 0; i < xs.length; i++) {\n      var x = xs[i];\n      if (x == null) continue;\n      if (prev != null) {\n        var d = x - prev, up = d > 0 ? d : 0, dn = d < 0 ? -d : 0;\n        if (ag == null) { g += up; l += dn; k++; if (k === n) { ag = g / n; al = l / n; } }\n        else { ag = (ag * (n - 1) + up) / n; al = (al * (n - 1) + dn) / n; }\n        if (ag != null) out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);\n      }\n      prev = x;\n    }\n    return out;\n  }\n  // highest / lowest close of the previous n days (today not included)\n  function prevExt(xs, n, hi) {\n    var out = new Array(xs.length).fill(null);\n    for (var i = n; i < xs.length; i++) {\n      var m = null, ok = true;\n      for (var j = i - n; j < i; j++) { var v = xs[j]; if (v == null) { ok = false; break; } if (m == null || (hi ? v > m : v < m)) m = v; }\n      if (ok) out[i] = m;\n    }\n    return out;\n  }\n  function ago(xs, n) {\n    var out = new Array(xs.length).fill(null);\n    for (var i = n; i < xs.length; i++) out[i] = xs[i - n];\n    return out;\n  }\n\n  // ---- data: { T: { d:[dates], o:[], h:[], l:[], c:[], div:{date: amount} } } \u2192 aligned arrays ----\n  function align(bars, tickers) {\n    var set = {};\n    tickers.forEach(function (t) { var b = bars[t]; if (b && b.d) b.d.forEach(function (d) { set[d] = 1; }); });\n    var dates = Object.keys(set).sort();\n    var idx = {};\n    dates.forEach(function (d, i) { idx[d] = i; });\n    var out = {};\n    tickers.forEach(function (t) {\n      var b = bars[t];\n      if (!b || !b.d || !b.d.length) return;\n      var n = dates.length, o = new Array(n).fill(null), h = new Array(n).fill(null), c = new Array(n).fill(null), div = new Array(n).fill(0);\n      for (var k = 0; k < b.d.length; k++) {\n        var i = idx[b.d[k]];\n        c[i] = num(b.c[k]);\n        o[i] = num(b.o[k]) != null ? b.o[k] : c[i];\n        h[i] = num(b.h[k]) != null ? b.h[k] : c[i];\n      }\n      Object.keys(b.div || {}).forEach(function (d) {\n        // a dividend on a non-trading date counts on the next trading day\n        var i = idx[d];\n        if (i == null) { for (var j = 0; j < n; j++) if (dates[j] > d) { i = j; break; } }\n        if (i != null) div[i] += +b.div[d] || 0;\n      });\n      // forward-filled close for valuation and indicators\n      var cf = new Array(n), last = null;\n      for (var m = 0; m < n; m++) { if (c[m] != null) last = c[m]; cf[m] = last; }\n      out[t] = { o: o, h: h, c: c, cf: cf, div: div, first: c.findIndex(function (x) { return x != null; }) };\n    });\n    return { dates: dates, tickers: out };\n  }\n\n  // indicator series, computed once per data set and shared by every strategy\n  function series(data, t, key) {\n    var cache = data._ind || (data._ind = {});\n    var k = t + '|' + key;\n    if (cache[k]) return cache[k];\n    var s = data.tickers[t], p = key.split(':'), n = +p[1], out;\n    if (p[0] === 'sma') out = sma(s.cf, n);\n    else if (p[0] === 'rsi') out = rsi(s.cf, n);\n    else if (p[0] === 'hi') out = rollMax(s.h.map(function (x, i) { return x != null ? x : s.cf[i]; }), n);\n    else if (p[0] === 'pmax') out = prevExt(s.cf, n, true);\n    else if (p[0] === 'pmin') out = prevExt(s.cf, n, false);\n    else if (p[0] === 'ago') out = ago(s.cf, n);\n    else throw new Error('unknown series ' + key);\n    return (cache[k] = out);\n  }\n\n  // ---- conditions for rule strategies ----\n  // each parameter: [min, max, default] for numbers, or a list of choices (first is the default)\n  var CONDS = {\n    price_sma: { n: [2, 400, 200], op: ['above', 'below'], pct: [0, 50, 0] },\n    sma_sma: { fast: [2, 400, 50], slow: [2, 400, 200], op: ['above', 'below', 'cross_up', 'cross_down'] },\n    rsi: { n: [2, 50, 14], op: ['below', 'above'], v: [1, 99, 30] },\n    drop_high: { n: [2, 260, 20], pct: [1, 80, 7] },\n    breakout: { n: [2, 260, 55], dir: ['high', 'low'] },\n    ret: { n: [2, 260, 126], op: ['above', 'below'], pct: [-90, 500, 0] },\n    market: { n: [2, 400, 200], op: ['above', 'below'] },\n  };\n  var RANKS = ['none', 'momentum', 'oversold'];\n\n  function clampNum(v, spec, int) {\n    v = +v;\n    if (!isFinite(v)) v = spec[2];\n    v = Math.min(spec[1], Math.max(spec[0], v));\n    return int ? Math.round(v) : Math.round(v * 100) / 100;\n  }\n  function cleanCond(c) {\n    if (!c || !CONDS[c.k]) return null;\n    var def = CONDS[c.k], out = { k: c.k };\n    Object.keys(def).forEach(function (p) {\n      var d = def[p];\n      if (typeof d[0] === 'string') out[p] = d.indexOf(c[p]) >= 0 ? c[p] : d[0];\n      else out[p] = clampNum(c[p] == null ? d[2] : c[p], d, p !== 'pct' && p !== 'v');\n    });\n    if (c.k === 'sma_sma' && out.fast >= out.slow) return null;      // the fast average must be shorter\n    return out;\n  }\n  function pctOrOff(v, max) { v = +v; return isFinite(v) && v > 0 ? Math.min(max, Math.round(v * 100) / 100) : 0; }\n  function intIn(v, lo, hi, d) { v = Math.round(+v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; }\n\n  /** Make a user-built strategy safe to run: known fields only, numbers in range. Null if unusable. */\n  function cleanCustom(sp) {\n    if (!sp || typeof sp !== 'object' || !/^c[a-z0-9]{2,10}$/.test(String(sp.id || ''))) return null;\n    var name = String(sp.name || '').replace(/[\\u0000-\\u001f<>]/g, '').trim().slice(0, 40) || 'My strategy';\n    var out = { id: sp.id, name: name, type: sp.type === 'rotation' ? 'rotation' : 'rules', on: sp.on !== false };\n    if (out.type === 'rotation') {\n      out.n = intIn(sp.n, 5, 260, 126);\n      out.top = intIn(sp.top, 1, 20, 3);\n      out.minRet = clampNum(sp.minRet == null ? 0 : sp.minRet, [-50, 500, 0], false);\n      out.market = +sp.market > 0 ? intIn(sp.market, 5, 400, 200) : 0;\n      return out;\n    }\n    out.entry = (Array.isArray(sp.entry) ? sp.entry : []).slice(0, 6).map(cleanCond).filter(Boolean);\n    out.exit = (Array.isArray(sp.exit) ? sp.exit : []).slice(0, 6).map(cleanCond).filter(Boolean);\n    if (!out.entry.length) return null;\n    out.stop = pctOrOff(sp.stop, 95);\n    out.take = pctOrOff(sp.take, 1000);\n    out.trail = pctOrOff(sp.trail, 95);\n    out.maxDays = intIn(sp.maxDays || 0, 0, 500, 0);\n    out.maxPos = intIn(sp.maxPos || 0, 0, 30, 0);\n    out.rank = RANKS.indexOf(sp.rank) >= 0 ? sp.rank : 'none';\n    out.cooldown = intIn(sp.cooldown || 0, 0, 250, 0);\n    return out;\n  }\n\n  /** Is condition c true for stock t at the close of day i? Missing history counts as false. */\n  function test(data, t, c, i, bench) {\n    if (c.k === 'market') {\n      if (!bench || !data.tickers[bench]) return true;                // no benchmark loaded: the filter can't apply\n      var b = data.tickers[bench].cf[i], m = series(data, bench, 'sma:' + c.n)[i];\n      if (b == null || m == null) return false;\n      return c.op === 'above' ? b > m : b < m;\n    }\n    var px = data.tickers[t].c[i];\n    if (px == null) return false;\n    var a;\n    switch (c.k) {\n      case 'price_sma':\n        a = series(data, t, 'sma:' + c.n)[i];\n        if (a == null) return false;\n        return c.op === 'above' ? px > a * (1 + c.pct / 100) : px < a * (1 - c.pct / 100);\n      case 'sma_sma':\n        var f = series(data, t, 'sma:' + c.fast), s = series(data, t, 'sma:' + c.slow);\n        if (f[i] == null || s[i] == null) return false;\n        if (c.op === 'above') return f[i] > s[i];\n        if (c.op === 'below') return f[i] < s[i];\n        if (i < 1 || f[i - 1] == null || s[i - 1] == null) return false;\n        return c.op === 'cross_up' ? f[i] > s[i] && f[i - 1] <= s[i - 1] : f[i] < s[i] && f[i - 1] >= s[i - 1];\n      case 'rsi':\n        a = series(data, t, 'rsi:' + c.n)[i];\n        if (a == null) return false;\n        return c.op === 'below' ? a < c.v : a > c.v;\n      case 'drop_high':\n        a = series(data, t, 'hi:' + c.n)[i];\n        return a != null && px <= a * (1 - c.pct / 100);\n      case 'breakout':\n        a = series(data, t, (c.dir === 'high' ? 'pmax:' : 'pmin:') + c.n)[i];\n        if (a == null) return false;\n        return c.dir === 'high' ? px > a : px < a;\n      case 'ret':\n        a = series(data, t, 'ago:' + c.n)[i];\n        if (a == null || !(a > 0)) return false;\n        return c.op === 'above' ? px / a - 1 > c.pct / 100 : px / a - 1 < c.pct / 100;\n    }\n    return false;\n  }\n\n  // plain-English descriptions (used in the app, the guide and the bot's emails)\n  function describeCond(c) {\n    switch (c.k) {\n      case 'price_sma': return 'the price closes ' + c.op + ' its ' + c.n + '-day average' + (c.pct ? ' by more than ' + c.pct + '%' : '');\n      case 'sma_sma': return 'its ' + c.fast + '-day average ' + ({ above: 'is above', below: 'is below', cross_up: 'crosses above', cross_down: 'crosses below' })[c.op] + ' its ' + c.slow + '-day average';\n      case 'rsi': return 'its ' + c.n + '-day RSI is ' + c.op + ' ' + c.v;\n      case 'drop_high': return 'it has fallen ' + c.pct + '% or more from its ' + c.n + '-day high';\n      case 'breakout': return c.dir === 'high' ? 'it closes above its highest close of the previous ' + c.n + ' days' : 'it closes below its lowest close of the previous ' + c.n + ' days';\n      case 'ret': return 'its ' + c.n + '-day return is ' + c.op + ' ' + c.pct + '%';\n      case 'market': return 'the ASX 200 fund is ' + c.op + ' its ' + c.n + '-day average';\n    }\n    return '';\n  }\n  function describe(sp) {\n    if (!sp) return [];\n    if (sp.type === 'rotation') {\n      return ['On the first trading day of each month, hold the ' + sp.top + ' stock' + (sp.top === 1 ? '' : 's') + ' with the best ' + sp.n + '-day return, in equal amounts.',\n        'Only stocks whose return is above ' + sp.minRet + '% qualify' + (sp.market ? ', and only while the ASX 200 fund is above its ' + sp.market + '-day average (otherwise sit in cash)' : '') + '.',\n        'Sell anything that drops out of the top ' + sp.top + '.'];\n    }\n    var L = [];\n    L.push('Buy when ' + sp.entry.map(describeCond).join(', and ') + '.');\n    var ex = sp.exit.map(describeCond);\n    if (sp.stop) ex.push('it falls ' + sp.stop + '% below the buy price (stop-loss)');\n    if (sp.trail) ex.push('it falls ' + sp.trail + '% below its best close since buying (trailing stop)');\n    if (sp.take) ex.push('it rises ' + sp.take + '% above the buy price (take profit)');\n    if (sp.maxDays) ex.push('it has been held ' + sp.maxDays + ' trading days');\n    L.push(ex.length ? 'Sell when ' + ex.join(', or ') + '.' : 'Never sells (no exit rules).');\n    L.push((sp.maxPos ? 'Hold at most ' + sp.maxPos + ' stocks, each an equal share of the money' : 'Each stock gets an equal share of the money') +\n      (sp.rank === 'momentum' ? '; when there are more buys than room, take the strongest 6-month performers first' : sp.rank === 'oversold' ? '; when there are more buys than room, take the most oversold (lowest RSI) first' : '') + '.');\n    if (sp.cooldown) L.push('After selling a stock, wait ' + sp.cooldown + ' trading days before buying it again.');\n    return L;\n  }\n\n  /** The first trading day whose open comes after a time 'YYYY-MM-DDTHH:MM' (Sydney). dates.length if none yet. */\n  function fillIndex(at, dates) {\n    var d = String(at).slice(0, 10), tm = String(at).slice(11, 16);\n    for (var j = 0; j < dates.length; j++) if (dates[j] > d || (dates[j] === d && tm < '10:00')) return j;\n    return dates.length;\n  }\n\n  var fee = function (value, cost) { return value > 0 ? Math.max(cost.feeMin, value * cost.feePct) : 0; };\n  var monthOf = function (d) { return d.slice(0, 7); };\n\n  // ---- the simulator ----\n  function simulate(data, cfg) {\n    var dates = data.dates;\n    var strat = cfg.strategy, key = cfg.key || strat, spec = cfg.spec || {};\n    var p = Object.assign({}, DEFAULTS[strat] || {}, (cfg.params || {})[strat] || {});\n    var cost = Object.assign({}, COSTS, cfg.costs || {});\n    var tickers = (cfg.tickers || []).filter(function (t) { return data.tickers[t]; });\n    var N = tickers.length;\n    var capital = +cfg.capital || 10000, topup = +cfg.topup || 0;\n    var start = 0;\n    while (start < dates.length && dates[start] < cfg.start) start++;\n    var end = dates.length - 1;\n    if (cfg.end) while (end > 0 && dates[end] > cfg.end) end--;\n    var res = { strategy: key, name: cfg.name || NAMES[strat], start: dates[start] || null, end: dates[end] || null, equity: [], trades: [], next: [], positions: {}, cash: capital, contributed: capital, metrics: null, tickers: tickers };\n    var manual = strat === 'manual';\n    var orders = manual ? (cfg.orders || []).filter(function (o) { return o && data.tickers[o.t]; }).map(function (o) { return Object.assign({}, o, { _i: fillIndex(o.at, dates) }); }) : [];\n    if (manual) res.rejected = [];\n    if ((!N && !manual) || start > end) {\n      res.metrics = metrics(res, []);\n      if (manual) res.next = orders.filter(function (o) { return o._i >= start; }).map(function (o) { return { t: o.t, side: o.side, qty: o.qty || null, value: o.value || null, why: o.note || 'Your order', strategy: key, oid: o.id, at: o.at }; });\n      return res;\n    }\n\n    // indicators per ticker (built-in strategies)\n    var ind = {};\n    if (STRATS.indexOf(strat) >= 0) tickers.forEach(function (t) {\n      var s = data.tickers[t];\n      ind[t] = {\n        sma: sma(s.cf, strat === 'dip' ? p.trend : (p.sma || 200)),\n        exit: strat === 'dip' ? sma(s.cf, p.exitSma) : null,\n        hi: strat === 'dip' ? rollMax(s.h.map(function (x, i) { return x != null ? x : s.cf[i]; }), p.lookback) : null,\n      };\n    });\n\n    var cash = capital, contributed = capital, pos = {}, pending = [], trades = [], eq = [], flows = [], fees = 0, divs = 0, exits = [], lastExit = {};\n    var lastEq = capital, prevIdx = 1, peak = 1, maxDD = 0, invSum = 0;\n\n    function value(i) { var v = cash; for (var t in pos) v += pos[t].qty * (data.tickers[t].cf[i] || 0); return v; }\n\n    function fill(o, i) {\n      var s = data.tickers[o.t], open = s.o[i];\n      if (open == null) return false;                     // no trading in this stock today: try again tomorrow\n      if (o.side === 'sell') {\n        var ps = pos[o.t];\n        if (!ps) { if (o.manual) res.rejected.push({ oid: o.oid, d: dates[i], t: o.t, side: 'sell', why: \"You didn't hold \" + o.t }); return true; }\n        var q = Math.min(o.qty || ps.qty, ps.qty);\n        var px = open * (1 - cost.slip), val = q * px, f = fee(val, cost);\n        cash += val - f; fees += f;\n        var costPart = ps.cost * (q / ps.qty);\n        if (q >= ps.qty) { exits.push({ t: o.t, pnl: val - f - ps.cost, days: i - ps.at }); delete pos[o.t]; lastExit[o.t] = i; }\n        else { ps.qty -= q; ps.cost -= costPart; }\n        var st = { d: dates[i], t: o.t, side: 'sell', qty: q, px: r2(px), fee: r2(f), value: r2(val), why: o.why, strategy: key };\n        if (o.manual) st.oid = o.oid;\n        trades.push(st);\n        return true;\n      }\n      var bpx = open * (1 + cost.slip);\n      var budget = o.manual && o.qty ? cash : Math.min(o.value, cash);\n      var qty = Math.floor(budget / (bpx * (1 + cost.feePct)));\n      if (o.manual && o.qty) qty = Math.min(qty, o.qty);\n      while (qty > 0 && qty * bpx + fee(qty * bpx, cost) > cash) qty--;\n      if (qty <= 0) {                                     // not enough cash: drop the order\n        if (o.manual) res.rejected.push({ oid: o.oid, d: dates[i], t: o.t, side: 'buy', why: 'Not enough cash' });\n        return true;\n      }\n      var bval = qty * bpx, bf = fee(bval, cost);\n      cash -= bval + bf; fees += bf;\n      var cur = pos[o.t];\n      if (cur) { cur.qty += qty; cur.cost += bval + bf; }\n      else pos[o.t] = { qty: qty, cost: bval + bf, at: i, entry: bpx, peak: bpx };\n      var bt = { d: dates[i], t: o.t, side: 'buy', qty: qty, px: r2(bpx), fee: r2(bf), value: r2(bval), why: o.why, strategy: key };\n      if (o.manual) { bt.oid = o.oid; if (o.qty && qty < o.qty) bt.why += ' (only ' + qty + ' of ' + o.qty + ' affordable)'; }\n      trades.push(bt);\n      return true;\n    }\n\n    function rulesSignals(i, E, orders) {\n      var maxPos = spec.maxPos || N, slot = E / maxPos, held = 0, selling = 0;\n      tickers.forEach(function (t) {\n        var ps = pos[t];\n        if (!ps) return;\n        held++;\n        var c = data.tickers[t].c[i];\n        if (c == null) return;\n        ps.peak = Math.max(ps.peak || ps.entry, c);\n        var why = null;\n        if (spec.stop && c <= ps.entry * (1 - spec.stop / 100)) why = 'Stop-loss: ' + spec.stop + '% below the buy price';\n        else if (spec.trail && c <= ps.peak * (1 - spec.trail / 100)) why = 'Trailing stop: ' + spec.trail + '% below its best close since buying';\n        else if (spec.take && c >= ps.entry * (1 + spec.take / 100)) why = 'Take profit: ' + spec.take + '% above the buy price';\n        else if (spec.maxDays && i - ps.at >= spec.maxDays) why = 'Held ' + spec.maxDays + ' trading days';\n        else for (var k = 0; k < spec.exit.length; k++) if (test(data, t, spec.exit[k], i, cfg.bench)) { why = 'Sell rule: ' + describeCond(spec.exit[k]); break; }\n        if (why) { orders.push({ t: t, side: 'sell', qty: ps.qty, why: why }); selling++; }\n      });\n      var room = maxPos - (held - selling);\n      if (room <= 0) return;\n      var cands = tickers.filter(function (t) {\n        if (pos[t] || data.tickers[t].c[i] == null) return false;\n        if (spec.cooldown && lastExit[t] != null && i - lastExit[t] <= spec.cooldown) return false;\n        for (var k = 0; k < spec.entry.length; k++) if (!test(data, t, spec.entry[k], i, cfg.bench)) return false;\n        return true;\n      });\n      if (spec.rank === 'momentum') {\n        var m = function (t) { var a = series(data, t, 'ago:126')[i]; return a ? data.tickers[t].c[i] / a : -Infinity; };\n        cands.sort(function (a, b) { return m(b) - m(a); });\n      } else if (spec.rank === 'oversold') {\n        var r = function (t) { var v = series(data, t, 'rsi:14')[i]; return v == null ? Infinity : v; };\n        cands.sort(function (a ssion.getEffectiveUser().getEmail(); }\nfunction hasTrigger_() { return ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === 'kabuDaily'; }); }\n\n// ---- the strategy engine (the same code the app uses for backtests) ----\n\n/* Kabu engine: the same code runs the backtests in the app and the paper bot in the Google bridge.\n   Daily bars. Signals are taken at the close; orders fill at the next trading day's open. */\nvar KabuEngine = (function () {\n  var STRATS = ['trend', 'monthly', 'dip'];\n  var NAMES = { trend: 'Trend filter', monthly: 'Monthly invest', dip: 'Dip buying', hold: 'Buy and hold', manual: 'You' };\n  var DEFAULTS = {\n    trend: { sma: 200, band: 0.02 },                                // hold while the close is 2% above its 200-day average; sell 2% below\n    monthly: { drift: 0.05 },                                       // rebalance to equal weight on the first trading day of each month\n    dip: { drop: 0.07, lookback: 20, trend: 200, exitSma: 10, maxDays: 20, stop: 0.08 },\n    hold: {},\n  };\n  var COSTS = { feePct: 0.001, feeMin: 5, slip: 0.0005 };\n\n  var r2 = function (x) { return Math.round(x * 100) / 100; };\n  var num = function (x) { return typeof x === 'number' && isFinite(x) ? x : null; };\n\n  // ---- indicators (null until there is enough history) ----\n  function sma(xs, n) {\n    var out = new Array(xs.length), sum = 0, q = [];\n    for (var i = 0; i < xs.length; i++) {\n      var x = xs[i];\n      if (x != null) { q.push(x); sum += x; if (q.length > n) sum -= q.shift(); }\n      out[i] = q.length >= n ? sum / n : null;\n    }\n    return out;\n  }\n  function rollMax(xs, n) {\n    var out = new Array(xs.length), q = [];\n    for (var i = 0; i < xs.length; i++) {\n      if (xs[i] != null) { q.push(xs[i]); if (q.length > n) q.shift(); }\n      out[i] = q.length ? Math.max.apply(null, q) : null;\n    }\n    return out;\n  }\n  // Wilder's RSI on closes\n  function rsi(xs, n) {\n    var out = new Ar function richText(str) {
  // **bold** and *italic* only
  const out = [];
  String(str).split(/(\*\*[^*]+\*\*|\*[^*]+\*)/).forEach(part => {
    if (/^\*\*[^*]+\*\*$/.test(part)) out.push(h('b', { text: part.slice(2, -2) }));
    else if (/^\*[^*]+\*$/.test(part)) out.push(h('i', { text: part.slice(1, -1) }));
    else if (part) out.push(part);
  });
  return out;
}

  S.br.useGet = false;
  saveBr();
  toast('Testing the bridge…');
  try {
    const j = await bridge('hello');
    S.trigger = j.trigger;
    S.brVersion = j.version || 1;
    // the bridge keeps the settings the bot uses: send this phone's
    const k = await bridge('config', { set: Object.assign({}, S.cfg, { appUrl: siteUrl() }) });
    S.cfg = Object.assign({}, DEFAULT_CFG, k.config);
    ls.set('kabu.cfg', S.cfg);
    toast(j.trigger ? 'Connected. Loading prices…' : 'Connected. Run setupKabu once in Apps Script to switch on the daily bot.');
    draw();
    await loadBars();
    loadStatus();
  } catch (e) { toast(brMsg(e)); draw(); }
}
function exportCsv(list, src) {
  const rows = [['date', 'strategy', 'stock', 'side', 'shares', 'price', 'value', 'fee', 'reason']].concat(list.map(t => [t.d, nameOf(t.strategy), t.t, t.side, t.qty, t.px, t.value, t.fee, t.why]));
  const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n');
  const name = `kabu-${src === 'paper' ? 'paper' : 'backtest-' + S.period}-trades.csv`;
  if (NATIVE) { native('saveFile', name, 'text/csv', csv); return; }
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `kabu-${src === 'paper' ? 'paper' : 'backtest-' + S.period}-trades.csv` });
  document.body.append(a); a.click(); a.remove();
}
let toastT = null;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = h('div', { class: 'toast', id: 'toast', role: 'status' }); document.body.append(t); }
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, 4200);
}

// ---------- updates (Android app) and bridge updates ----------
function bridgeUpdateNote() {
  return h('div', { class: 'notice', id: 'bridge-update' },
    h('b', { text: `Bridge update: your bridge is v${S.brVersion}, this Kabu needs v${BRIDGE_VERSION}` }),
    h('ol', { class: 'steps' },
      h('li', null, 'Tap ', h('b', { text: 'Copy bridge script' }), ' below.'),
      h('li', { text: 'In Apps Script, select all the old code, paste over it and save.' }),
      h('li', null, h('b', { text: 'Deploy → Manage deployments' }), ', tap the pencil, set Version to ', h('b', { text: 'New version' }), ', then Deploy. The URL stays the same, and your paper trading carries on.'),
      h('li', null, 'Back here, tap refresh. This box disappears when the bridge reports v' + BRIDGE_VERSION + '.')),
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: copyScript }, 'Copy bridge script')));
}
const whatsNew = () => h('ul', { class: 'bullets' }, WHATS_NEW.map(t => h('li', { text: t })));
/** Home: update waiting, just updated, needs a new app, or rolled back. */
function updateBanner() {
  return [justUpdatedCard(), nativeUpdateCard()].filter(Boolean);
}
function justUpdatedCard() {
  if (!S.justUpdated) return null;
  return h('section', { class: 'notice ok', id: 'updated' },
    h('div', { class: 'row' }, h('b', { class: 'grow', text: `Updated to Kabu ${S.justUpdated.to} ✓` }), h('span', { class: 'lbl', text: 'was ' + S.justUpdated.from })),
    h('span', { class: 'lbl', text: "What's new" }), whatsNew(),
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => { S.justUpdated = null; draw(true); } }, 'Got it')));
}
function nativeUpdateCard() {
  const u = S.update || {};
  if (!NATIVE) return null;
  if (u.state === 'ready') return h('section', { class: 'notice', id: 'update-ready' },
    h('div', { class: 'row' }, h('b', { class: 'grow', text: 'Update ready' }), h('span', { class: 'mono', text: `${APP_VERSION} → ${u.name}` })),
    h('p', { class: 'muted', text: `You're on ${APP_VERSION}. Kabu ${u.name} has been downloaded and checked. Restarting takes a second; your data stays.` }),
    u.notes ? h('p', { class: 'muted', text: "What's new: " + u.notes }) : null,
    h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', id: 'apply-update', onclick: () => native('applyUpdate') }, `Restart to update to ${u.name}`)));
  if (u.state === 'shell') return h('section', { class: 'notice warn' },
    h('b', { text: `Kabu ${u.name} needs a newer app (you're on ${APP_VERSION})` }), h('p', { class: 'muted', text: 'Install the latest APK from the kabu-android releases on GitHub, over the top of this one. Your data stays.' }),
    u.apk ? h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => native('openUrl', u.apk) }, 'Open releases')) : null);
  if (u.state === 'rolledback') return h('section', { class: 'notice warn' }, h('b', { text: `The update to ${u.name} didn't start, so Kabu went back to ${APP_VERSION}.` }), h('p', { class: 'muted', text: 'It will not try that version again. A fixed version will install as usual.' }));
  return null;
}
/** Settings: which version you're on, what your website has, and the update button. */
function appCard() {
  const i = nativeInfo() || {}, u = S.update || {};
  const when = i.lastCheck ? new Date(i.lastCheck).toLocaleString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : 'not yet';
  const latest = u.state === 'ready' ? u.name : (u.latestName || i.latestName || '');
  const state = u.state === 'checking' ? ['Checking…', '']
    : u.state === 'ready' ? [`${u.name} is ready: restart to update`, 'warn']
    : u.state === 'error' ? ["Couldn't check: " + (u.error || 'no connection'), 'err']
    : latest && latest === APP_VERSION ? ['Up to date ✓', 'ok']
    : latest ? [`Your site has ${latest}`, ''] : ['Not checked yet', ''];
  const site = h('input', { id: 'site-url', type: 'url', value: i.site || '', autocomplete: 'off', placeholder: 'https://YOURNAME.github.io/kabu/' });
  site.addEventListener('change', () => { const v = site.value.trim(); if (/^https:\/\/[^\s]+\/$/.test(v)) { native('setSite', v); toast('Update address saved.'); } else { site.value = i.site || ''; toast('Use the full address of your Kabu site, ending in /'); } });
  return card('App updates', h('span', { class: 'status-chip ' + state[1], id: 'update-state', text: state[0] }),
    h('dl', { class: 'kv' },
      h('dt', { text: 'You are on' }), h('dd', { id: 'ver-current', text: `Kabu ${APP_VERSION}` }),
      h('dt', { text: 'Your website has' }), h('dd', { id: 'ver-latest', text: latest || '—' }),
      h('dt', { text: 'App (APK)' }), h('dd', { text: i.shellName ? '1 · build ' + i.shellName : '—' }),
      h('dt', { text: 'Last checked' }), h('dd', { id: 'ver-checked', text: when })),
    h('div', { class: 'row' },
      u.state === 'ready' ? h('button', { class: 'btn primary', type: 'button', id: 'apply-update-2', onclick: () => native('applyUpdate') }, `Restart to update to ${u.name}`)
        : h('button', { class: 'btn', type: 'button', id: 'check-update', disabled: u.state === 'checking', onclick: () => { S.update = { state: 'checking' }; draw(true); native('checkForUpdate'); } }, 'Check for updates')),
    h('details', null, h('summary', null, h('span', { class: 'muted', text: 'How updates work' })),
      h('div', { class: 'stack' }, h('p', { class: 'muted', text: 'Kabu checks your website for a newer version.json when it starts and every 6 hours. It downloads index.html, checks it matches exactly, and switches to it when you restart (or next time it starts). The version at the top of the screen changes, and Home says "Updated to …". If a new version fails to start, Kabu goes back by itself.' }),
        h('label', { class: 'field' }, h('span', { class: 'lbl', text: 'Kabu website' }), site))));
}
addEventListener('kabu-native', e => {
  const d = (e && e.detail) || {};
  if (d.type !== 'update') return;
  const was = S.update && S.update.state;
  if (d.state === 'none' && was === 'ready') return;            // a download is still waiting: keep showing it
  S.update = d;
  if (d.state === 'ready' && was !== 'ready') toast(`Kabu ${d.name} is ready. You're on ${APP_VERSION}: restart to update.`);
  if (d.state === 'none' && d.manual) toast(d.latestName && d.latestName !== APP_VERSION ? `Your site has ${d.latestName}; you're on ${APP_VERSION}.` : `You're on ${APP_VERSION}, the latest ✓`);
  if (d.state === 'error') toast("Couldn't check for updates: " + (d.error || 'no connection'));
  draw();
});
// Android back button: close a sheet, then go back to Home, then let the app close
window.kabuBack = () => {
  if (S.sheet) { closeSheet(); return true; }
  if (innerWidth < 720 && S.tab !== 'home') { go('home'); return true; }
  return false;
};
// ---------- layout ----------
const TABS = [['home', 'Home', 'home'], ['strategies', 'Strategies', 'strategies'], ['trade', 'Trade', 'trade'], ['stocks', 'Stocks', 'stocks'], ['settings', 'Settings', 'gear']];
const VIEWS = { home: viewHome, strategies: viewStrategies, trade: viewTrade, stocks: viewStocks, settings: viewSettings };
function go(tab) {
  if (innerWidth >= 720 && tab !== 'home') { S.right = tab; ls.set('kabu.right', tab); }
  S.tab = tab;
  ls.set('kabu.tab', tab);
  draw(true);
  scrollTo(0, 0);
}

// The phone keyboard changes the page height when it opens. Redrawing then would replace the text box you are
// typing in and close the keyboard, so: redraw only when the width changes, hold background redraws while you
// type, and when a redraw must happen (you pressed a button), put the cursor back where it was.
const typing = () => {
  const a = document.activeElement, app = $('#app');
  return !!a && !!app && app.contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|range|reset)$/.test(a.type)));
};
let drawPending = false;
function draw(force) {
  if (!force && typing()) { drawPending = true; return; }
  drawPending = false;
  const a = document.activeElement;
  const keep = a && a.id && typing() ? { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  syncColours();
  const wide = innerWidth >= 720;
  const app = $('#app');
  const top = h('header', { class: 'top' },
    h('span', { class: 'brand' }, 'KABU', h('small', { text: '株' })),
    h('span', { class: 'ver', id: 'app-version', title: 'The version of Kabu you are using', text: APP_VERSION }),
    h('span', { class: 'pill', text: 'PAPER' }),
    h('span', { class: 'grow' }),
    lastDate() ? h('span', { class: 'lbl hide-narrow', text: shortDay(lastDate()) }) : null,
    h('button', { class: 'ghost' + (S.busy ? ' spin' : ''), type: 'button', id: 'refresh', 'aria-label': 'Refresh prices', onclick: () => { loadBars(true); loadStatus(); } }, icon('refresh')),
    h('button', { class: 'ghost', type: 'button', 'aria-label': 'How it works', onclick: () => openHelp() }, icon('help')));
  let panes;
  if (wide) {
    const r = S.right === 'home' || !VIEWS[S.right] ? 'strategies' : S.right;
    panes = [h('div', { class: 'pane', id: 'pane-home' }, VIEWS.home()),
      h('div', { class: 'pane', id: 'pane-right' }, h('nav', { class: 'rtabs', role: 'tablist' }, TABS.slice(1).map(([k, l]) => h('button', { type: 'button', role: 'tab', id: 'rtab-' + k, 'aria-selected': String(r === k), onclick: () => go(k) }, l))), VIEWS[r]())];
  } else {
    panes = [h('div', { class: 'pane', id: 'pane-main' }, VIEWS[S.tab] ? VIEWS[S.tab]() : VIEWS.home())];
  }
  const tabs = h('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Sections' }, TABS.map(([k, l, ic]) => h('button', { class: 'tab', type: 'button', role: 'tab', id: 'tab-' + k, 'aria-selected': String(S.tab === k), onclick: () => go(k) }, icon(ic), l)));
  app.replaceChildren(top, h('main', { class: 'panes' }, panes), tabs);
  after.splice(0).forEach(f => f());
  if (keep) {
    const n = document.getElementById(keep.id);
    if (n) { if (n.value !== keep.v) n.value = keep.v; n.focus({ preventScroll: true }); try { n.setSelectionRange(keep.s, keep.e); } catch (e) {} }
  }
}
document.addEventListener('focusout', () => setTimeout(() => { if (drawPending && !typing()) draw(); }, 0));
let lastW = innerWidth, rT = null;
addEventListener('resize', () => {
  if (innerWidth === lastW) return;               // height-only changes are the keyboard: ignore them
  lastW = innerWidth;
  clearTimeout(rT);
  rT = setTimeout(() => draw(), 120);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && normUrl(S.br.url)) { loadBars(); loadStatus(); } });

async function boot() {
  const cached = await idb.get('bars');
  if (cached && cached.bars) { S.bars = cached.bars; S.barsAt = cached.at || 0; }
  // "Updated to v3": compare with the version this phone last ran
  const seen = ls.get('kabu.seenVersion', null);
  if (seen && seen !== APP_VERSION) S.justUpdated = { from: seen, to: APP_VERSION };
  ls.set('kabu.seenVersion', APP_VERSION);
  draw();
  if (NATIVE) { const u = native('updateState'); if (u) { try { S.update = JSON.parse(u); } catch (e) {} } native('ready', APP_VERSION); draw(); }
  if (S.justUpdated) toast(`Updated to Kabu ${APP_VERSION} ✓`);
  if (normUrl(S.br.url)) { await loadStatus(); await loadBars(); }
  if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__kabu = { S, E, results, draw, go };
boot();
})();
