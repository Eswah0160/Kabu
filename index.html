<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kabu</title>
<meta name="description" content="Test simple trading rules on real ASX prices, then run them with paper money.">
<meta name="theme-color" content="#111110">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root {
  --paper: #E7E7E4; --sheet: #F6F6F3; --ink: #262625; --ink-2: #63635F; --rule: #D3D3CF; --soft: #EEEEEA;
  --red: #BD3226; --up: #1d7a4f; --down: #BD3226;
  --s-trend: #2a78d6; --s-monthly: #eb6834; --s-dip: #1baf7a; --s-bench: #8a8a85;
  --shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 24px -18px rgba(0,0,0,.35);
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-body: "Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #9A9A95; --rule: #2C2C2A; --soft: #232322;
    --red: #FF6B5E; --up: #4cc38a; --down: #FF6B5E;
    --s-trend: #3987e5; --s-monthly: #d95926; --s-dip: #199e70; --s-bench: #8d8d88;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111110; --sheet: #1A1A19; --ink: #E7E7E3; --ink-2: #9A9A95; --rule: #2C2C2A; --soft: #232322;
  --red: #FF6B5E; --up: #4cc38a; --down: #FF6B5E;
  --s-trend: #3987e5; --s-monthly: #d95926; --s-dip: #199e70; --s-bench: #8d8d88;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.lbl { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); font-size: 13.5px; margin: 0; }
.err { color: var(--red); font-size: 14px; margin: 0; }
.up { color: var(--up); } .down { color: var(--down); }
[data-s="trend"] { --c: var(--s-trend); } [data-s="monthly"] { --c: var(--s-monthly); } [data-s="dip"] { --c: var(--s-dip); } [data-s="bench"] { --c: var(--s-bench); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--ink-2)); flex: none; }

/* frame */
.app { min-height: 100%; display: flex; flex-direction: column; max-width: 1240px; margin: 0 auto; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--paper); }
.brand { font-family: var(--f-mono); font-weight: 500; letter-spacing: 0.3em; font-size: 15px; }
.brand small { font-weight: 400; letter-spacing: 0.1em; color: var(--ink-2); margin-left: 4px; }
.pill { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.12em; border: 1px solid var(--ink-2); border-radius: 999px; padding: 2px 8px; color: var(--ink-2); }
.grow { flex: 1; }
.ghost { border: 0; background: none; min-width: 40px; height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); padding: 0 8px; }
.ghost:active { background: var(--soft); }
.ghost svg { width: 19px; height: 19px; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.panes { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 0 12px 84px; }
.pane { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--sheet); border-top: 1px solid var(--rule); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
.tab { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; min-height: 52px; color: var(--ink-2); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 8px; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { stroke-width: 2.2; }
.rtabs { display: none; }
@media (min-width: 720px) {
  .panes { grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.4fr); padding-bottom: 16px; }
  .tabs { display: none; }
  .rtabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .rtabs button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; min-height: 38px; padding: 0 12px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
  .rtabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
}

/* cards */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
.card-head { display: flex; align-items: center; gap: 2px 8px; flex-wrap: wrap; }
.card-head h2 { white-space: nowrap; }
.card-head .lbl { margin-left: auto; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; min-height: 42px; padding: 0 14px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); font-weight: 500; }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, var(--rule)); }
.btn:disabled { opacity: 0.5; }
.link { border: 0; background: none; padding: 6px 0; min-height: 36px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule); background: transparent; border-radius: 999px; min-height: 36px; padding: 0 12px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.08em; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.chip .dot { width: 8px; height: 8px; }

/* home */
.hero-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.notice { border: 1px dashed var(--ink-2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.notice.warn { border-color: var(--red); }
.orders { display: flex; flex-direction: column; }
.order { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--rule); }
.order:first-child { border-top: 0; padding-top: 2px; }
.order .side { font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; }
.order .side.sell { color: var(--red); }
.order .what { font-family: var(--f-mono); font-size: 14px; }
.order .why { grid-column: 2 / -1; color: var(--ink-2); font-size: 13px; }
.strat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; border: 0; background: none; text-align: left; padding: 12px 0; border-top: 1px solid var(--rule); width: 100%; }
.strat:first-of-type { border-top: 0; }
.strat .nm { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.strat .val { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
.strat .sub { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.strat .spark { grid-column: 1 / -1; height: 34px; width: 100%; }
.big { font-family: var(--f-mono); font-size: 30px; font-weight: 400; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

/* charts */
.chart { position: relative; width: 100%; touch-action: pan-y; user-select: none; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .grid line { stroke: var(--rule); stroke-width: 1; }
.chart .axis text { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink-2); }
.chart .ser { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ser.bench { stroke-dasharray: 4 4; stroke-width: 1.6; }
.chart .ser.thin { stroke-width: 1.4; }
.chart .xh { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .pt { fill: var(--c); stroke: var(--sheet); stroke-width: 2; }
.chart .mk-b { fill: var(--up); } .chart .mk-s { fill: var(--down); }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--sheet); border-radius: 8px; padding: 6px 9px; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; white-space: nowrap; transform: translateX(-50%); z-index: 2; }
.tip .r { display: flex; align-items: center; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ln { width: 16px; height: 0; border-top: 2px solid var(--c); }
.legend .ln.dash { border-top-style: dashed; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); text-align: right; padding: 6px 6px; white-space: nowrap; }
.tbl td { padding: 9px 6px; border-top: 1px solid var(--rule); text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 0; }
.tbl td:first-child { font-family: var(--f-body); }
.tbl tr.click { cursor: pointer; }
.tbl .nm { display: inline-flex; align-items: center; gap: 7px; }
.scroll-x { overflow-x: auto; }
.wide-only, .mid-only { display: none; }
@media (min-width: 430px) { .mid-only { display: table-cell; } }
@media (min-width: 560px) { .wide-only { display: table-cell; } }
.log { display: flex; flex-direction: column; }
.log-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.log-row:first-child { border-top: 0; }
.log-row .d { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.log-row .t { font-family: var(--f-mono); font-size: 14px; }
.log-row .v { font-family: var(--f-mono); font-size: 13px; text-align: right; }
.log-row .why { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-2); }

/* forms */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field input, .field select { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; min-height: 42px; padding: 0 10px; width: 100%; font-family: var(--f-mono); font-size: 14px; }
.field input:focus { outline: 2px solid var(--ink-2); outline-offset: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 42px; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }
details summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; min-height: 40px; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "▾"; margin-left: auto; color: var(--ink-2); }
details[open] summary::after { content: "▴"; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.tickers { display: flex; flex-wrap: wrap; gap: 6px; }
.tk { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--rule); border-radius: 999px; padding: 0 2px 0 12px; font-family: var(--f-mono); font-size: 13px; min-height: 36px; }
.tk button { border: 0; background: none; min-width: 32px; min-height: 32px; color: var(--ink-2); border-radius: 999px; }

/* sheet (modal) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(20,20,18,.42); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet); width: 100%; max-width: 720px; max-height: 92vh; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; }
.sheet-body { overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 14px; } }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--sheet); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
@media (min-width: 720px) { .toast { bottom: 24px; } }
.foot { text-align: center; padding: 6px 0 2px; }
.help h3 { margin: 6px 0 0; font-size: 15px; }
.help p { margin: 0; font-size: 14.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-family: var(--f-mono); text-align: right; }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const ENGINE_SRC = "/* Kabu engine: the same code runs the backtests in the app and the paper bot in the Google bridge.\n   Daily bars. Signals are taken at the close; orders fill at the next trading day's open. */\nvar KabuEngine = (function () {\n  var STRATS = ['trend', 'monthly', 'dip'];\n  var NAMES = { trend: 'Trend filter', monthly: 'Monthly invest', dip: 'Dip buying', hold: 'Buy and hold' };\n  var DEFAULTS = {\n    trend: { sma: 200, band: 0.02 },                                // hold while the close is 2% above its 200-day average; sell 2% below\n    monthly: { drift: 0.05 },                                       // rebalance to equal weight on the first trading day of each month\n    dip: { drop: 0.07, lookback: 20, trend: 200, exitSma: 10, maxDays: 20, stop: 0.08 },\n    hold: {},\n  };\n  var COSTS = { feePct: 0.001, feeMin: 5, slip: 0.0005 };\n\n  var r2 = function (x) { return Math.round(x * 100) / 100; };\n  var num = function (x) { return typeof x === 'number' && isFinite(x) ? x : null; };\n\n  // ---- indicators (null until there is enough history) ----\n  function sma(xs, n) {\n    var out = new Array(xs.length), sum = 0, q = [];\n    for (var i = 0; i < xs.length; i++) {\n      var x = xs[i];\n      if (x != null) { q.push(x); sum += x; if (q.length > n) sum -= q.shift(); }\n      out[i] = q.length >= n ? sum / n : null;\n    }\n    return out;\n  }\n  function rollMax(xs, n) {\n    var out = new Array(xs.length), q = [];\n    for (var i = 0; i < xs.length; i++) {\n      if (xs[i] != null) { q.push(xs[i]); if (q.length > n) q.shift(); }\n      out[i] = q.length ? Math.max.apply(null, q) : null;\n    }\n    return out;\n  }\n\n  // ---- data: { T: { d:[dates], o:[], h:[], l:[], c:[], div:{date: amount} } } \u2192 aligned arrays ----\n  function align(bars, tickers) {\n    var set = {};\n    tickers.forEach(function (t) { var b = bars[t]; if (b && b.d) b.d.forEach(function (d) { set[d] = 1; }); });\n    var dates = Object.keys(set).sort();\n    var idx = {};\n    dates.forEach(function (d, i) { idx[d] = i; });\n    var out = {};\n    tickers.forEach(function (t) {\n      var b = bars[t];\n      if (!b || !b.d || !b.d.length) return;\n      var n = dates.length, o = new Array(n).fill(null), h = new Array(n).fill(null), c = new Array(n).fill(null), div = new Array(n).fill(0);\n      for (var k = 0; k < b.d.length; k++) {\n        var i = idx[b.d[k]];\n        c[i] = num(b.c[k]);\n        o[i] = num(b.o[k]) != null ? b.o[k] : c[i];\n        h[i] = num(b.h[k]) != null ? b.h[k] : c[i];\n      }\n      Object.keys(b.div || {}).forEach(function (d) {\n        // a dividend on a non-trading date counts on the next trading day\n        var i = idx[d];\n        if (i == null) { for (var j = 0; j < n; j++) if (dates[j] > d) { i = j; break; } }\n        if (i != null) div[i] += +b.div[d] || 0;\n      });\n      // forward-filled close for valuation and indicators\n      var cf = new Array(n), last = null;\n      for (var m = 0; m < n; m++) { if (c[m] != null) last = c[m]; cf[m] = last; }\n      out[t] = { o: o, h: h, c: c, cf: cf, div: div, first: c.findIndex(function (x) { return x != null; }) };\n    });\n    return { dates: dates, tickers: out };\n  }\n\n  var fee = function (value, cost) { return value > 0 ? Math.max(cost.feeMin, value * cost.feePct) : 0; };\n  var monthOf = function (d) { return d.slice(0, 7); };\n\n  // ---- the simulator ----\n  function simulate(data, cfg) {\n    var dates = data.dates;\n    var strat = cfg.strategy;\n    var p = Object.assign({}, DEFAULTS[strat] || {}, (cfg.params || {})[strat] || {});\n    var cost = Object.assign({}, COSTS, cfg.costs || {});\n    var tickers = (cfg.tickers || []).filter(function (t) { return data.tickers[t]; });\n    var N = tickers.length;\n    var capital = +cfg.capital || 10000, topup = +cfg.topup || 0;\n    var start = 0;\n    while (start < dates.length && dates[start] < cfg.start) start++;\n    var end = dates.length - 1;\n    if (cfg.end) while (end > 0 && dates[end] > cfg.end) end--;\n    var res = { strategy: strat, name: NAMES[strat], start: dates[start] || null, end: dates[end] || null, equity: [], trades: [], next: [], positions: {}, cash: capital, contributed: capital, metrics: null, tickers: tickers };\n    if (!N || start > end) { res.metrics = metrics(res, []); return res; }\n\n    // indicators per ticker\n    var ind = {};\n    tickers.forEach(function (t) {\n      var s = data.tickers[t];\n      ind[t] = {\n        sma: sma(s.cf, strat === 'dip' ? p.trend : (p.sma || 200)),\n        exit: strat === 'dip' ? sma(s.cf, p.exitSma) : null,\n        hi: strat === 'dip' ? rollMax(s.h.map(function (x, i) { return x != null ? x : s.cf[i]; }), p.lookback) : null,\n      };\n    });\n\n    var cash = capital, contributed = capital, pos = {}, pending = [], trades = [], eq = [], flows = [], fees = 0, divs = 0, exits = [];\n    var lastEq = capital, prevIdx = 1, peak = 1, maxDD = 0, invSum = 0;\n\n    function value(i) { var v = cash; for (var t in pos) v += pos[t].qty * (data.tickers[t].cf[i] || 0); return v; }\n\n    function fill(o, i) {\n      var s = data.tickers[o.t], open = s.o[i];\n      if (open == null) return false;                     // no trading in this stock today: try again tomorrow\n      if (o.side === 'sell') {\n        var ps = pos[o.t];\n        if (!ps) return true;\n        var q = Math.min(o.qty || ps.qty, ps.qty);\n        var px = open * (1 - cost.slip), val = q * px, f = fee(val, cost);\n        cash += val - f; fees += f;\n        var costPart = ps.cost * (q / ps.qty);\n        if (q >= ps.qty) { exits.push({ t: o.t, pnl: val - f - ps.cost, days: i - ps.at }); delete pos[o.t]; }\n        else { ps.qty -= q; ps.cost -= costPart; }\n        trades.push({ d: dates[i], t: o.t, side: 'sell', qty: q, px: r2(px), fee: r2(f), value: r2(val), why: o.why, strategy: strat });\n        return true;\n      }\n      var bpx = open * (1 + cost.slip);\n      var budget = Math.min(o.value, cash);\n const normUrl = u => String(u || '').trim().replace(/[?#].*$/, '').replace(/\/macros\/u\/\d+\/s\//, '/macros/s/');

}

}

    case 'network': return "Couldn't reach the bridge. Check you're online and the URL ends in /exec.";
    case 'signin': return 'Google asked for a sign-in. In Apps Script set Who has access to Anyone, then deploy a new version.';
    case 'bad_secret': return 'The bridge has a different key. Copy the bridge script again, paste it over the old code and deploy a new version.';
    case 'bad_reply': return "That URL didn't answer like Kabu's bridge. Use the Web app URL that ends in /exec.";
    case 'too_big': return 'That request is too big for this connection.';
  }
  if (/yahoo|prices_failed/.test(m)) return "Yahoo Finance didn't answer (it limits how often it can be asked). Try again in a few minutes." + (/unknown_ticker/.test(m) ? ' ' + m.replace(/.*unknown_ticker (\S+).*/, '$1 isn\'t an ASX code Yahoo knows.') : '');
  if (/unknown_ticker/.test(m)) return m.replace(/.*unknown_ticker (\S+).*/, '$1 isn\'t an ASX code Yahoo knows.');

}

      h('div', { class: 'legend' }, h('span', null, h('i', { class: 'ln', style: '--c:var(--ink)' }), t), h('span', null, h('i', { class: 'ln dash', style: '--c:var(--ink-2)' }), '200-day average'), h('span', null, '▲ buy  ▼ sell')),
      h('div', { class: 'chips' }, E.STRATS.map(k => h('button', { class: 'chip', type: 'button', 'data-s': k, 'aria-pressed': String(S.stockStrat === k), onclick: () => { S.stockStrat = k; const b = $('.sheet-body', S.sheet); b.replaceChildren(...render().flat(3).filter(Boolean)); after.splice(0).forEach(f => f()); } }, h('span', { class: 'dot' }), NAME[k]))),
      h('dl', { class: 'kv' }, h('dt', { text: '1-year change' }), h('dd', { text: pct(c / s.cf[from] - 1) }), h('dt', { text: 'Below its 1-year high' }), h('dd', { text: pct(c / hi - 1) }), h('dt', { text: 'vs 200-day average' }), h('dd', { text: a200[n - 1] ? pct(c / a200[n - 1] - 1) : '—' })),
      trades.length ? h('div', { class: 'log' }, trades.slice().reverse().map(tradeRow)) : h('p', { class: 'muted', text: `No ${NAME[S.stockStrat].toLowerCase()} trades in ${t} in the last year (${results('paper') ? 'paper' : 'backtest'}).` }),
    ];
  };
  openSheet(t, render());
}
function openHelp() {
  openSheet('How Kabu works', h('div', { class: 'help', style: 'display:flex;flex-direction:column;gap:10px' },
    h('h3', { text: 'What it does' }),
    h('p', { text: 'Kabu runs three simple trading rules on real ASX prices. The Compare tab shows what they would have done over the past years. Paper trading then runs them forward from the day you start, with pretend money, so you see how they behave on prices nobody had seen when you switched it on.' }),
    h('h3', { text: 'The three strategies' }),
    ...E.STRATS.map(k => h('p', null, h('b', { text: NAME[k] + '. ' }), RULES[k]().join(' '))),
    h('p', { text: `Each is compared with simply buying and holding ${S.cfg.bench} (an ASX 200 fund).` }),
    h('h3', { text: 'How trades are counted' }),
    h('p', { text: 'Rules are checked after each close; orders fill at the next morning\'s open, plus slippage and brokerage. Whole shares only. Dividends are paid in cash on the ex-date. Returns are time-weighted, so monthly top-ups don\'t count as profit.' }),
    h('h3', { text: 'The bot and the daily email' }),
    h('p', { text: 'Your bridge (a Google Apps Script in your account) runs after every ASX close on weekdays, updates prices, runs the rules on your paper money and emails you when something was bought or sold, or is due tomorrow. It never places real orders.' }),
    h('h3', { text: 'Be careful with results' }),
    h('p', { text: `Costs matter more than they look: with ${money(S.cfg.capital)} spread over ${S.cfg.tickers.length} stocks, each position is about ${money(S.cfg.capital / Math.max(1, S.cfg.tickers.length))}, so a ${money(S.cfg.costs.feeMin)} minimum fee is ${(S.cfg.costs.feeMin / (S.cfg.capital / Math.max(1, S.cfg.tickers.length)) * 100).toFixed(1)}% of every trade. Strategies that trade often pay that again and again.` }),
    h('p', { text: 'Backtests flatter: the rules were chosen knowing roughly how markets went. A strategy that beats the index on paper for a few months has not proven much. Most people who trade actively do worse than buying and holding an index fund. This is a tool for learning, not financial advice.' })));
}

// ---------- actions ----------
function startPaper() {
  saveCfg({ paperStart: sydToday() }, true);
  toast('Paper trading starts at today\'s close. The bot places its first paper orders then.');
}
function confirmRestart() {
  openSheet('Restart paper trading?', [
    h('p', { text: 'Paper trading will begin again from today with ' + money(S.cfg.capital) + '. The current paper results are replaced (they are always recalculated from the start date).' }),
    h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', id: 'confirm-restart', onclick: () => { closeSheet(); startPaper(); } }, 'Restart from today'), h('button', { class: 'btn', type: 'button', onclick: closeSheet }, 'Cancel')),
  ]);
}
async function runNow() {
  toast('Running the bot…');
  try { const j = await bridge('run'); S.status = j.status; toast(j.status && j.status.error ? 'The bot hit a problem: ' + brMsg({ message: j.status.error }) : 'The bot ran' + (j.status && j.status.emailed ? ' and emailed you.' : '.')); await loadBars(true); }
  catch (e) { toast(brMsg(e)); }
  draw();
}
const bridgeText = () => BRIDGE_SRC.replace('__SECRET__', S.br.secret);
async function copyScript() {
  try { await navigator.clipboard.writeText(bridgeText()); toast('Bridge script copied. Paste it into a new Apps Script project.'); }
  catch (e) { toast("Couldn't copy here. Use Share it instead."); }
}
async function testBridge(u) {
  const url = normUrl(u);
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) { toast('Paste the Web app URL from Apps Script: it starts with https://script.google.com/macros/s/ and ends in /exec.'); return; }
  S.br.url = url;
  S.br.useGet = false;
  saveBr();
  toast('Testing the bridge…');
  try {
    const j = await bridge('hello');
    S.trigger = j.trigger;
    // the bridge keeps the settings the bot uses: send this phone's
    const k = await bridge('config', { set: Object.assign({}, S.cfg, { appUrl: location.origin + location.pathname }) });
    S.cfg = Object.assign({}, DEFAULT_CFG, k.config);
    ls.set('kabu.cfg', S.cfg);
    toast(j.trigger ? 'Connected. Loading prices…' : 'Connected. Run setupKabu once in Apps Script to switch on the daily bot.');
    draw();
    await loadBars();
    loadStatus();
  } catch (e) { toast(brMsg(e)); draw(); }
}
function exportCsv(list, src) {
  const rows = [['date', 'strategy', 'stock', 'side', 'shares', 'price', 'value', 'fee', 'reason']].concat(list.map(t => [t.d, NAME[t.strategy], t.t, t.side, t.qty, t.px, t.value, t.fee, t.why]));
  const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',')).join('\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `kabu-${src === 'paper' ? 'paper' : 'backtest-' + S.period}-trades.csv` });
  document.body.append(a); a.click(); a.remove();
}
let toastT = null;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = h('div', { class: 'toast', id: 'toast', role: 'status' }); document.body.append(t); }
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, 4200);
}

// ---------- layout ----------
const TABS = [['home', 'Home'], ['compare', 'Compare'], ['stocks', 'Stocks'], ['log', 'Trades'], ['settings', 'Settings']];
const VIEWS = { home: viewHome, compare: viewCompare, stocks: viewStocks, log: viewLog, settings: viewSettings };
function go(tab) {
  if (innerWidth >= 720 && tab !== 'home') { S.right = tab; ls.set('kabu.right', tab); }
  S.tab = tab;
  ls.set('kabu.tab', tab);
  draw();
  scrollTo(0, 0);
}
function draw() {
  const wide = innerWidth >= 720;
  const app = $('#app');
  const top = h('header', { class: 'top' },
    h('span', { class: 'brand' }, 'KABU', h('small', { text: '株' })),
    h('span', { class: 'pill', text: 'PAPER' }),
    h('span', { class: 'grow' }),
    lastDate() ? h('span', { class: 'lbl', text: shortDay(lastDate()) }) : null,
    h('button', { class: 'ghost' + (S.busy ? ' spin' : ''), type: 'button', id: 'refresh', 'aria-label': 'Refresh prices', onclick: () => { loadBars(true); loadStatus(); } }, icon('refresh')),
    h('button', { class: 'ghost', type: 'button', 'aria-label': 'How it works', onclick: () => openHelp() }, icon('help')));
  let panes;
  if (wide) {
    const r = S.right === 'home' ? 'compare' : S.right;
    panes = [h('div', { class: 'pane', id: 'pane-home' }, VIEWS.home()),
      h('div', { class: 'pane', id: 'pane-right' }, h('nav', { class: 'rtabs', role: 'tablist' }, TABS.slice(1).map(([k, l]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(r === k), onclick: () => go(k) }, l))), VIEWS[r]())];
  } else {
    panes = [h('div', { class: 'pane', id: 'pane-main' }, VIEWS[S.tab] ? VIEWS[S.tab]() : VIEWS.home())];
  }
  const tabs = h('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Sections' }, TABS.map(([k, l]) => h('button', { class: 'tab', type: 'button', role: 'tab', id: 'tab-' + k, 'aria-selected': String(S.tab === k), onclick: () => go(k) }, icon(k === 'log' ? 'log' : k === 'settings' ? 'gear' : k), l)));
  app.replaceChildren(top, h('main', { class: 'panes' }, panes), tabs);
  after.splice(0).forEach(f => f());
}
let rT = null;
addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(draw, 120); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && normUrl(S.br.url)) { loadBars(); loadStatus(); } });

async function boot() {
  const cached = await idb.get('bars');
  if (cached && cached.bars) { S.bars = cached.bars; S.barsAt = cached.at || 0; }
  draw();
  if (normUrl(S.br.url)) { await loadStatus(); await loadBars(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__kabu = { S, E, results, draw };
boot();
})();
